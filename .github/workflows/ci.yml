name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Cross-compile
        run: |
          GOOS=windows go build -o /dev/null ./cmd/abyssdb
          GOOS=darwin go build -o /dev/null ./cmd/abyssdb
          GOOS=wasip1 GOARCH=wasm go build -o /dev/null ./cmd/abyssdb
          GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/abyssdb-web
