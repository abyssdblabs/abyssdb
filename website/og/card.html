<!doctype html>
<!--
  Open Graph card template; it fills the window it is rendered in (1200×630
  for link previews, 1280×640 for GitHub's social preview). Parameters come
  from the URL hash:
  #eyebrow=…&title=…&accent=…&sub=…&stats=value|label;value|label
  Rendered to website/public/og/*.png by website/og/render.sh.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500..700&display=block" rel="stylesheet" />
<style>
  :root { --bg: #04050a; --text: #eef0f7; --muted: #9aa1b5; --faint: #5e6478; --violet: #8b5cf6; --cyan: #22d3ee; --pink: #f472b6;
          --grad: linear-gradient(120deg, #a78bfa 0%, #22d3ee 45%, #f472b6 100%); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text);
               font-family: Geist, system-ui, sans-serif; }
  .card { position: relative; width: 100vw; height: 100vh; padding: 64px 72px; display: flex; flex-direction: column; }
  .bg { position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(600px 420px at 88% 46%, rgba(139,92,246,.28), transparent 70%),
          radial-gradient(500px 300px at 10% 110%, rgba(34,211,238,.14), transparent 70%); }
  .hole { position: absolute; right: -120px; top: 50%; width: 600px; height: 600px; transform: translateY(-50%); z-index: 0; }
  .hole .disk { position: absolute; inset: 0; border-radius: 50%;
                background: conic-gradient(from 200deg, rgba(139,92,246,.0), rgba(139,92,246,.9), rgba(34,211,238,.8), rgba(244,114,182,.85), rgba(139,92,246,.0) 80%);
                -webkit-mask: radial-gradient(circle, transparent 37%, #000 38.5%, #000 41%, transparent 56%);
                filter: blur(2px); }
  .hole .halo { position: absolute; inset: 14%; border-radius: 50%; box-shadow: 0 0 90px 30px rgba(139,92,246,.35); }
  .hole .core { position: absolute; inset: 31%; border-radius: 50%; background: #000; box-shadow: 0 0 0 3px rgba(167,139,250,.55), 0 0 60px 10px rgba(139,92,246,.55); }
  .grain { position: absolute; inset: 0; z-index: 0; opacity: .5;
           background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px); background-size: 4px 4px; }
  .content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; max-width: 760px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; }
  .brand svg { width: 46px; height: 46px; }
  .eyebrow { margin-top: auto; font: 600 19px "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
  h1 { margin: 16px 0 0; font-size: 76px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 750; }
  h1 #title { white-space: pre-line; }
  h1 .accent { display: block; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 20px 0 0; font-size: 27px; line-height: 1.35; color: var(--muted); max-width: 720px; }
  .stats { display: flex; gap: 14px; margin-top: 34px; }
  .stat { padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); }
  .stat b { display: block; font-size: 32px; font-weight: 750; letter-spacing: -0.03em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat span { font-size: 16px; color: var(--muted); }
  .url { position: absolute; z-index: 1; right: 72px; bottom: 56px; font: 600 20px "Geist Mono", monospace; color: var(--faint); }
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="hole"><div class="halo"></div><div class="disk"></div><div class="core"></div></div>
  <div class="grain"></div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><circle cx="32" cy="32" r="22" fill="none" stroke="url(#g)" stroke-width="7"/><circle cx="32" cy="32" r="12" fill="#000"/></svg>
      AbyssDB
    </div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1><span id="title"></span> <span class="accent" id="accent"></span></h1>
    <p class="sub" id="sub"></p>
    <div class="stats" id="stats"></div>
  </div>
  <div class="url">abyssdb.xyz</div>
</div>
<script>
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("size")) document.querySelector("h1").style.fontSize = p.get("size") + "px";
  for (const id of ["eyebrow", "title", "accent", "sub"]) document.getElementById(id).textContent = p.get(id) ?? "";
  if (!p.get("sub")) document.getElementById("sub").remove();
  const stats = document.getElementById("stats");
  for (const s of (p.get("stats") ?? "").split(";").filter(Boolean)) {
    const [v, l] = s.split("|");
    const d = document.createElement("div");
    d.className = "stat";
    d.innerHTML = "<b></b><span></span>";
    d.querySelector("b").textContent = v;
    d.querySelector("span").textContent = l;
    stats.append(d);
  }
  if (!stats.children.length) stats.remove();
  document.fonts.ready.then(() => document.body.setAttribute("data-ready", "1"));
</script>
</body>
</html>
